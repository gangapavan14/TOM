services:

  mysql:
    image: mysql:8.0
    container_name: tom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tom_db
      MYSQL_USER: tom_user
      MYSQL_PASSWORD: tom_pass
    ports:
      - "3306:3306"
    volumes:
      - tom_mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+05:30
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "tom_user", "-ptom_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tom-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tom_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: tom_user
      SPRING_DATASOURCE_PASSWORD: tom_pass
      JWT_SECRET: Change-This-In-Production-Use-A-Long-Random-String-At-Least-256-Bits
    ports:
      - "8080:8080"
    volumes:
      - tom_uploads:/app/uploads

  frontend:
    build:
      context: ./tom-frontend
      dockerfile: Dockerfile
    container_name: tom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  tom_mysql_data:
  tom_uploads:
